apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: erp-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: api.erp-system.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: erp-backend-service
            port:
              number: 80
